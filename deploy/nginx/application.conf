server {
    listen 80;
    listen [::]:80;
    server_name __APP_HOST__;
    server_tokens off;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 308 https://__APP_HOST__$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __APP_HOST__;
    ssl_certificate /etc/letsencrypt/live/__APP_HOST__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__APP_HOST__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:MostV2TLS:10m;
    ssl_session_timeout 1d;
    server_tokens off;
    root /var/www/most-support-v2;
    index index.html;
    client_max_body_size 128k;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    add_header Permissions-Policy "camera=(), microphone=(self), geolocation=()" always;

    location = / { return 302 /app/; }
    location = /app { return 308 /app/; }
    location = /app/runtime-config.js {
        alias /etc/most-support-v2/runtime-config.js;
        default_type application/javascript;
        add_header Cache-Control "no-store, max-age=0" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy same-origin always;
        add_header Permissions-Policy "camera=(), microphone=(self), geolocation=()" always;
    }
    location /app/ {
        try_files $uri $uri/ /app/index.html;
        expires -1;
    }
    location /static/ {
        alias /var/lib/most-support-v2/static/;
        expires 1h;
        access_log off;
    }
    location ~ /\. { deny all; }
    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Overwrite all client-supplied proxy headers.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Forwarded "";
        proxy_set_header Connection "";
        proxy_read_timeout 65s;
        proxy_send_timeout 65s;
        proxy_redirect off;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
    }
}
