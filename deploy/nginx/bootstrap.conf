# HTTP serves only the ACME challenge until a real certificate is installed.
server {
    listen 80;
    listen [::]:80;
    server_name __APP_HOST__;
    server_tokens off;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 503; }
}
