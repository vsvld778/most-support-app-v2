location = /staff-test { return 308 /staff-test/; }
location = /staff-test/ { return 302 /staff-test/cabinet/; }
location = /staff-test/app/runtime-config.js {
    alias /etc/most-support-staff-sandbox/runtime-config.js;
    default_type application/javascript;
    expires -1;
}
location ^~ /staff-test/app/ {
    root /var/www/most-support-staff-sandbox;
    index index.html;
    try_files $uri $uri/ =404;
    expires -1;
}
location ^~ /staff-test/static/ {
    alias /var/lib/most-support-staff-sandbox/static/;
    expires -1;
}
location ^~ /staff-test/admin/ { return 404; }
location ^~ /staff-test/ {
    proxy_pass http://127.0.0.1:8002/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Forwarded "";
    proxy_set_header Connection "";
    proxy_redirect off;
    proxy_no_cache 1;
    proxy_cache_bypass 1;
}
