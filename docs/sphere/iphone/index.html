<!doctype html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111e1d">
  <meta name="description" content="Интерактивный Sphere Wallet в рамке iPhone 18 Pro Max.">
  <title>Sphere Wallet · iPhone 18 Pro Max</title>
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <style>
    :root {
      --panel: #fbfdfb;
      --line: #d9e4de;
      --muted: #526c64;
      --selection: #e3f0e9;
      --accent: #176363;
      color: #173b3b;
      background: #eef3f0;
      font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color-scheme: light;
    }
    * { box-sizing: border-box; }
    body { margin: 0; }
    .preview {
      padding: max(12px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right))
        max(16px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
    }
    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 4px 14px;
      width: min(100%, 900px);
      margin: 0 auto;
      padding: 0 4px;
    }
    h1 { margin: 0; font-size: 16px; font-weight: 680; }
    .device-label { color: var(--muted); font-weight: 500; }
    .direct {
      display: inline-flex;
      align-items: center;
      min-height: 44px;
      color: var(--accent);
      text-decoration-thickness: 1px;
      text-underline-offset: 4px;
      font-size: 13px;
    }
    .workspace {
      display: grid;
      grid-template-columns: minmax(206px, 254px) minmax(0, 1fr);
      align-items: start;
      gap: clamp(16px, 4vw, 44px);
      width: min(100%, 900px);
      margin: 10px auto 0;
    }
    .contents {
      min-width: 0;
      max-height: calc(100vh - 88px);
      max-height: calc(100dvh - 88px);
      overflow: auto;
      overscroll-behavior: contain;
      scrollbar-width: thin;
      scrollbar-color: var(--line) transparent;
      border: 1px solid var(--line);
      border-radius: 19px;
      background: var(--panel);
    }
    .contents summary {
      cursor: pointer;
      padding: 12px 16px;
      font-weight: 680;
      min-height: 44px;
    }
    .contents h2 { margin: 0 0 12px; padding: 0 8px; font-size: 16px; line-height: 1.3; }
    .contents nav { padding: 17px 10px 12px; }
    .contents-search { padding: 0 8px 11px; }
    .contents-search input {
      width: 100%; min-height: 42px; padding: 8px 10px; border: 1px solid var(--line);
      border-radius: 10px; background: transparent; color: inherit; font: inherit; font-size: 13px;
    }
    .contents-search input::placeholder { color: var(--muted); }
    .contents-search input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
    .empty-search { padding: 8px; color: var(--muted); font-size: 13px; }
    [hidden] { display: none !important; }
    .contents ul { list-style: none; margin: 0; padding: 0; }
    .contents li + li { margin-top: 1px; }
    .contents section + section { margin-top: 8px; border-top: 1px solid var(--line); padding-top: 9px; }
    .contents h3 { margin: 0 8px 5px; color: var(--muted); font-size: 11px; font-weight: 650; }
    .contents a {
      display: flex;
      align-items: center;
      min-height: 32px;
      padding: 6px 9px;
      color: inherit;
      border-radius: 9px;
      text-decoration: none;
      font-size: 13px;
      line-height: 1.35;
      overflow-wrap: anywhere;
    }
    .contents a:hover, .contents a[aria-current="page"] { background: var(--selection); color: var(--accent); }
    .contents a[aria-current="page"] { font-weight: 690; }
    .contents :is(a, summary):focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
    .stage { display: grid; min-width: 0; justify-items: center; }
    .frame-slot {
      position: relative;
      width: min(100%, 334px);
      aspect-ratio: 462 / 978;
    }
    .phone {
      --screen-bg: #f5f7f6;
      --screen-ink: #173b3b;
      position: absolute;
      top: 0;
      left: 0;
      width: 462px;
      height: 978px;
      padding: 10px;
      border: 1px solid #656d6b;
      border-radius: 62px;
      background: #171c1d;
      box-shadow: 0 24px 64px #19383324, inset 0 0 0 2px #a6aba6;
      transform: scale(.72);
      transform-origin: top left;
    }
    .phone[data-theme="dark"] {
      --screen-bg: #101f20;
      --screen-ink: #edf5f1;
    }
    .display {
      display: grid;
      grid-template-rows: 55px minmax(0, 1fr) 26px;
      height: 100%;
      overflow: hidden;
      border-radius: 51px;
      background: var(--screen-bg);
      color: var(--screen-ink);
    }
    .status {
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: relative;
      padding: 0 34px;
      font-size: 16px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }
    .island {
      position: absolute;
      top: 12px;
      left: 50%;
      width: 112px;
      height: 29px;
      transform: translateX(-50%);
      border-radius: 30px;
      background: #090d0e;
    }
    .indicators { display: flex; align-items: center; gap: 6px; }
    .signal { display: flex; align-items: flex-end; gap: 2px; }
    .signal i { width: 3px; height: 5px; background: currentColor; border-radius: 1px; }
    .signal i:nth-child(2) { height: 8px; }
    .signal i:nth-child(3) { height: 11px; }
    .signal i:nth-child(4) { height: 14px; }
    .wifi { position: relative; width: 16px; height: 12px; border-radius: 50%; border-top: 2px solid; }
    .wifi::before {
      position: absolute; content: ""; inset: 2px 3px auto; height: 8px;
      border-radius: 50%; border-top: 2px solid;
    }
    .wifi::after {
      position: absolute; content: ""; left: 6px; bottom: 1px;
      width: 4px; height: 4px; border-radius: 50%; background: currentColor;
    }
    .battery { position: relative; width: 22px; height: 12px; border: 1px solid; border-radius: 4px; }
    .battery::before { position: absolute; content: ""; inset: 1px 3px 1px 1px; border-radius: 2px; background: currentColor; }
    .battery::after { position: absolute; content: ""; right: -3px; top: 3px; width: 1px; height: 4px; background: currentColor; }
    iframe { display: block; width: 100%; height: 100%; min-height: 0; border: 0; }
    .gesture { display: grid; place-items: center; }
    .gesture::before { content: ""; width: 134px; height: 5px; border-radius: 5px; background: currentColor; }
    @media (min-width: 701px) { .contents summary { display: none; } }
    @media (max-width: 700px) {
      .workspace { grid-template-columns: minmax(0, 1fr); gap: 12px; margin-top: 4px; }
      .contents { max-height: min(460px, 60dvh); }
      .contents h2 { display: none; }
      .contents nav { padding-top: 0; }
      .contents a { min-height: 42px; }
    }
    @media (max-width: 460px) {
      h1 { font-size: 14px; }
      .direct { font-size: 12px; }
    }
    :root[data-theme="dark"] {
      --panel: #192c2d;
      --line: #314a47;
      --muted: #b1c7be;
      --selection: #22423b;
      --accent: #9ed8ce;
      background: #111e1d;
      color: #e3eee8;
      color-scheme: dark;
    }
  </style>
</head>
<body>
  <main class="preview">
    <header class="toolbar">
      <h1>Sphere Wallet <span class="device-label">· iPhone 18 Pro Max</span></h1>
      <a class="direct" href="../design10/?view=mobile#home">Открыть без рамки</a>
    </header>
    <div class="workspace">
      <details class="contents" open>
        <summary>Оглавление</summary>
        <nav aria-label="Оглавление Sphere Wallet">
          <h2>Оглавление</h2>
          <div class="contents-search">
            <input id="screen-search" type="search" placeholder="Найти экран" aria-label="Поиск по оглавлению">
          </div>
          <div id="screen-contents"></div>
          <p class="empty-search" hidden>Экраны не найдены</p>
        </nav>
      </details>
      <div class="stage">
        <div class="frame-slot">
          <div class="phone" data-theme="dark">
            <div class="display">
              <div class="status" aria-hidden="true">
                <span>9:41</span>
                <span class="island"></span>
                <span class="indicators">
                  <span class="signal"><i></i><i></i><i></i><i></i></span>
                  <span class="wifi"></span><span class="battery"></span>
                </span>
              </div>
              <iframe title="Sphere Wallet"></iframe>
              <div class="gesture" aria-hidden="true"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>
  <script type="module" src="preview.js?v=2"></script>
</body>
</html>
