<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#eef3f0">
  <meta name="description" content="Интерактивный «Мост поддержки» в рамке iPhone 18 Pro Max.">
  <title>Мост поддержки · iPhone 18 Pro Max</title>
  <link rel="icon" href="../assets/logo-mark.webp">
  <style>
    :root {
      color: #173b3b;
      background: #eef3f0;
      font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color-scheme: light;
    }
    * { box-sizing: border-box; }
    body { margin: 0; }
    .preview {
      padding: max(12px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right))
        max(16px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
    }
    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 4px 14px;
      width: min(100%, 840px);
      margin: 0 auto;
      padding: 0 4px;
    }
    h1 { margin: 0; font-size: 16px; font-weight: 680; }
    .direct {
      display: inline-flex;
      align-items: center;
      min-height: 44px;
      color: #176363;
      text-decoration-thickness: 1px;
      text-underline-offset: 4px;
      font-size: 13px;
    }
    .stage { display: grid; justify-items: center; padding-top: 10px; }
    .frame-slot {
      position: relative;
      width: min(100%, 334px);
      aspect-ratio: 462 / 978;
    }
    .phone {
      --screen-bg: #f5f7f6;
      --screen-ink: #173b3b;
      position: absolute;
      top: 0;
      left: 0;
      width: 462px;
      height: 978px;
      padding: 10px;
      border: 1px solid #656d6b;
      border-radius: 62px;
      background: #171c1d;
      box-shadow: 0 24px 64px #19383324, inset 0 0 0 2px #a6aba6;
      transform: scale(.72);
      transform-origin: top left;
    }
    .phone[data-theme="dark"] {
      --screen-bg: #101f20;
      --screen-ink: #edf5f1;
    }
    .display {
      display: grid;
      grid-template-rows: 55px minmax(0, 1fr) 26px;
      height: 100%;
      overflow: hidden;
      border-radius: 51px;
      background: var(--screen-bg);
      color: var(--screen-ink);
    }
    .status {
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: relative;
      padding: 0 34px;
      font-size: 16px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }
    .island {
      position: absolute;
      top: 12px;
      left: 50%;
      width: 112px;
      height: 29px;
      transform: translateX(-50%);
      border-radius: 30px;
      background: #090d0e;
    }
    .indicators { display: flex; align-items: center; gap: 6px; }
    .signal { display: flex; align-items: flex-end; gap: 2px; }
    .signal i { width: 3px; height: 5px; background: currentColor; border-radius: 1px; }
    .signal i:nth-child(2) { height: 8px; }
    .signal i:nth-child(3) { height: 11px; }
    .signal i:nth-child(4) { height: 14px; }
    .wifi { position: relative; width: 16px; height: 12px; border-radius: 50%; border-top: 2px solid; }
    .wifi::before {
      position: absolute; content: ""; inset: 2px 3px auto; height: 8px;
      border-radius: 50%; border-top: 2px solid;
    }
    .wifi::after {
      position: absolute; content: ""; left: 6px; bottom: 1px;
      width: 4px; height: 4px; border-radius: 50%; background: currentColor;
    }
    .battery { position: relative; width: 22px; height: 12px; border: 1px solid; border-radius: 4px; }
    .battery::before { position: absolute; content: ""; inset: 1px 3px 1px 1px; border-radius: 2px; background: currentColor; }
    .battery::after { position: absolute; content: ""; right: -3px; top: 3px; width: 1px; height: 4px; background: currentColor; }
    iframe { display: block; width: 100%; height: 100%; min-height: 0; border: 0; }
    .gesture { display: grid; place-items: center; }
    .gesture::before { content: ""; width: 134px; height: 5px; border-radius: 5px; background: currentColor; }
    @media (max-width: 460px) {
      h1 { font-size: 14px; }
      .direct { font-size: 12px; }
      .stage { padding-top: 4px; }
    }
    @media (prefers-color-scheme: dark) {
      :root { background: #111e1d; color: #e3eee8; color-scheme: dark; }
      .direct { color: #9ed8ce; }
    }
  </style>
</head>
<body>
  <main class="preview">
    <header class="toolbar">
      <h1>iPhone 18 Pro Max</h1>
      <a class="direct" href="../">Открыть без рамки</a>
    </header>
    <div class="stage">
      <div class="frame-slot">
        <div class="phone">
          <div class="display">
            <div class="status" aria-hidden="true">
              <span>9:41</span>
              <span class="island"></span>
              <span class="indicators">
                <span class="signal"><i></i><i></i><i></i><i></i></span>
                <span class="wifi"></span><span class="battery"></span>
              </span>
            </div>
            <iframe src="../" title="Мост поддержки в мобильном режиме"></iframe>
            <div class="gesture" aria-hidden="true"></div>
          </div>
        </div>
      </div>
    </div>
  </main>
  <script>
    const stage = document.querySelector(".stage");
    const slot = document.querySelector(".frame-slot");
    const phone = document.querySelector(".phone");
    const app = document.querySelector("iframe");

    function fitPhone() {
      const maxScale = Math.min(1, stage.clientWidth / phone.offsetWidth);
      const stageTop = stage.getBoundingClientRect().top + window.scrollY;
      const height = document.documentElement.clientHeight - stageTop - 30;
      const scale = Math.min(maxScale, Math.max(.64, height / phone.offsetHeight));
      slot.style.width = `${phone.offsetWidth * scale}px`;
      slot.style.height = `${phone.offsetHeight * scale}px`;
      phone.style.transform = `scale(${scale})`;
    }

    // Follow the application's selected theme in the simulated system bars.
    let themeObserver;
    function matchAppTheme() {
      themeObserver?.disconnect();
      const appRoot = app.contentDocument?.documentElement;
      if (!appRoot) return;
      // Preserve the full 440 px layout width while keeping the page scrollable.
      appRoot.style.scrollbarWidth = "none";
      const update = () => {
        phone.dataset.theme = appRoot.dataset.theme || "light";
      };
      update();
      themeObserver = new MutationObserver(update);
      themeObserver.observe(appRoot, { attributes: true, attributeFilter: ["data-theme"] });
    }

    fitPhone();
    window.addEventListener("resize", fitPhone);
    app.addEventListener("load", matchAppTheme);
    matchAppTheme();
  </script>
</body>
</html>
