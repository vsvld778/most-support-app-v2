name: Verify V2
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check theme.js
          node --check i18n.js
          node --check sw.js
          node --check sync.js
          node --check runtime-config.js
          for file in modules/*.js; do node --check "$file"; done
      - name: Check deployment scripts
        run: for file in deploy/*.sh; do bash -n "$file"; done
      - name: Test user scenarios
        run: node --test tests/*.test.cjs
      - name: Verify published assets match source
        run: |
          python tools/build-static.py
          git diff --exit-code -- docs
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: most_platform_ci
          POSTGRES_PASSWORD: most-platform-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d most_platform_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r backend/requirements.txt
      - name: Test authentication, permissions and workspace isolation
        working-directory: backend
        run: python manage.py test portal --settings=config.test_settings
      - name: Test PostgreSQL data isolation and both upgrade paths
        working-directory: backend
        run: python manage.py test portal --settings=config.postgres_test_settings
      - name: Check migrations
        run: python backend/manage.py makemigrations --check --dry-run --settings=config.test_settings
